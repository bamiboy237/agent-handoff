name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # current LTS; package.json engines requires >=22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  scripts:
    name: Shell and Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: bash -n remote/runner.sh
      - name: Lint shell script
        # shellcheck is preinstalled on ubuntu-latest runners.
        run: shellcheck --severity=warning remote/runner.sh
      - name: Check Python syntax
        run: python3 -m py_compile bridges/prime.py
